name: Reusable Semgrep

on:
  workflow_call:
    inputs:
      base-sha:
        description: Check only changes after this commit. Pull requests use their base commit.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Detect Frappe app package
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hooks < <(find . -mindepth 2 -maxdepth 3 -type f -name hooks.py -not -path './.git/*' -print)
          if [ "${#hooks[@]}" -ne 1 ]; then
            echo "Expected exactly one Frappe hooks.py, found ${#hooks[@]}" >&2
            printf '%s\n' "${hooks[@]}" >&2
            exit 1
          fi
          app_dir="$(dirname "${hooks[0]}")"
          echo "app_dir=${app_dir#./}" >> "$GITHUB_OUTPUT"

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Install Semgrep
        id: install
        run: pip install semgrep

      - name: Run Semgrep rules
        env:
          # Keep existing findings visible in manual full scans, but block PRs on new findings.
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.base-sha }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_args=()
          if [ -n "$SEMGREP_BASELINE_REF" ]; then
            baseline_args=(--baseline-commit "$SEMGREP_BASELINE_REF")
          fi
          semgrep scan --config ./frappe-semgrep-rules/rules \
            --config r/python.lang.security \
            --severity=ERROR --error "${baseline_args[@]}" "${{ steps.app.outputs.app_dir }}"

      - name: Full Semgrep evidence report
        id: full_scan
        # Keep evidence when the gate above fails; skip only when Semgrep is not installed.
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          semgrep scan --config ./frappe-semgrep-rules/rules \
            --config r/python.lang.security \
            --json --output audit-artifacts/semgrep-full.json \
            "${{ steps.app.outputs.app_dir }}"
          python - <<'PY'
          import json
          import os
          from collections import Counter

          with open("audit-artifacts/semgrep-full.json", encoding="utf-8") as report:
              payload = json.load(report)
          findings = payload.get("results", [])
          if not isinstance(findings, list):
              raise SystemExit("Semgrep report missing results list")
          counts = Counter(
              finding.get("extra", {}).get("severity", "UNKNOWN")
              for finding in findings
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Frappe Semgrep baseline evidence\n\n")
              summary.write(f"Total findings: **{len(findings)}**\n\n")
              for severity, count in sorted(counts.items()):
                  summary.write(f"- {severity}: {count}\n")
              summary.write("\nFull finding-level JSON is attached as a workflow artifact. "
                            "A passing differential scan does not close historical findings.\n")
          PY

      - name: Upload Semgrep findings
        if: always() && steps.full_scan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-finding-evidence
          path: audit-artifacts/semgrep-full.json
          if-no-files-found: error
          retention-days: 90
