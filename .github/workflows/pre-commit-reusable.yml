name: Reusable Pre-commit

on:
  workflow_call:
    inputs:
      maintenance-ref:
        description: frappe-maintenance ref for config files; match the caller workflow ref.
        type: string
        default: main
      base-sha:
        description: Check only changes after this commit. Pull requests use their base commit.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frappe-maintenance
        uses: actions/checkout@v4
        with:
          repository: Aakvatech-Limited/frappe-maintenance
          ref: ${{ inputs.maintenance-ref }}
          path: .frappe-maintenance

      - name: Link config files from frappe-maintenance
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: python3 .frappe-maintenance/scripts/app_config_links.py ci --root . --repository "$REPOSITORY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pre-commit/action@v3.0.1
        env:
          # Report new security findings on PRs; manual runs still scan everything.
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.base-sha }}
        with:
          extra_args: ${{ (github.event.pull_request.base.sha || inputs.base-sha) && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha || inputs.base-sha, github.sha) || '--all-files' }}
