name: Reusable Pre-commit

on:
  workflow_call:
    inputs:
      maintenance-ref:
        description: frappe-maintenance ref for managed config templates; match the caller workflow ref.
        type: string
        default: stable

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pre-commit/action@v3.0.1
        env:
          # Report new security findings on PRs; manual runs still scan everything.
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha || '' }}
        with:
          extra_args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.sha) || '--all-files' }}

      # Checked out after pre-commit so its --all-files run does not lint these files.
      - name: Checkout frappe-maintenance
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: Aakvatech-Limited/frappe-maintenance
          ref: ${{ inputs.maintenance-ref }}
          path: .frappe-maintenance

      - name: Check managed config files
        if: ${{ !cancelled() }}
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python .frappe-maintenance/scripts/check_app_config_drift.py --root . --repository "$REPOSITORY" --branch "$BASE_BRANCH"
