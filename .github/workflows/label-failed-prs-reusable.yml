name: Reusable Label Failed Pull Requests

on:
  workflow_call:
    inputs:
      checks-failed:
        description: Set by a pull_request run with its own check result; labels that PR only.
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-failed-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile failed-action labels
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'action-failed';
            const failedConclusions = new Set([
              'failure',
              'timed_out',
              'startup_failure',
              'action_required'
            ]);

            async function reconcile(prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              if (pr.state !== 'open') return;

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: pr.head.sha,
                  per_page: 100
                }
              );

              // Only pull_request runs; this workflow's own runs use other events.
              const relevantRuns = runs.filter(run =>
                run.event === 'pull_request' &&
                run.status === 'completed'
              );

              const hasFailure = relevantRuns.some(run =>
                failedConclusions.has(run.conclusion)
              );

              const labels = pr.labels.map(item => item.name);
              const hasLabel = labels.includes(label);

              if (hasFailure && !hasLabel) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: [label]
                });
                core.info(`Added ${label} to PR #${prNumber}`);
              } else if (!hasFailure && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label
                });
                core.info(`Removed ${label} from PR #${prNumber}`);
              } else {
                core.info(`PR #${prNumber}: no label change required`);
              }
            }

            const checksFailed = '${{ inputs.checks-failed }}';
            if (context.eventName === 'pull_request' && checksFailed) {
              const pr = context.payload.pull_request;
              const hasLabel = pr.labels.some(item => item.name === label);
              try {
                if (checksFailed === 'true' && !hasLabel) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels: [label]
                  });
                } else if (checksFailed !== 'true' && hasLabel) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, name: label
                  });
                }
              } catch (error) {
                // Runs for fork PRs get a read-only token; the failed checks stay visible on the PR.
                core.warning(`Cannot change labels on PR #${pr.number}: ${error.message}`);
              }
              return;
            }

            if (context.eventName === 'workflow_dispatch') {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              core.info(`Reconciling ${prs.length} open PR(s)`);
              for (const pr of prs) await reconcile(pr.number);
              return;
            }

            const run = context.payload.workflow_run;
            if (!run || run.event !== 'pull_request') return;

            const prNumbers = new Set((run.pull_requests || []).map(pr => pr.number));
            if (prNumbers.size === 0) {
              core.info('Completed workflow run is not associated with an open pull request.');
              return;
            }

            for (const prNumber of prNumbers) await reconcile(prNumber);
