name: Publish stable workflows

# Every merge to main is published to stable after validation, so a reviewed
# and merged PR is live for app repositories without a manual step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate-workflows.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward stable to the merged commit
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let exists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'heads/stable' });
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }
            if (exists) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/stable', sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/stable', sha });
            }
            await core.summary.addHeading('Stable workflows published')
              .addRaw(`Commit: ${sha}\n\nApp repositories use this version on their next triggered run.`).write();
