name: Mass PR Across Organization

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Configuration file under this repository
        required: true
        default: configs/frappe-maintenance.json
        type: string
      dry_run:
        description: Inspect only; do not create branches, commits, or PRs
        required: true
        default: true
        type: boolean

jobs:
  mass-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance repository
        uses: actions/checkout@v4

      - name: Execute mass PR configuration
        env:
          GH_TOKEN: ${{ secrets.ORG_MAINTENANCE_TOKEN }}
          CONFIG_PATH: ${{ inputs.config_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/bootstrap_org.sh
