name: Reusable Semantic Commits

on:
  workflow_call:
    inputs:
      maintenance-ref:
        description: frappe-maintenance ref for config files; match the caller workflow ref.
        type: string
        default: stable
      base-sha:
        description: Check only changes after this commit. Pull requests use their base commit.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: commitcheck-${{ github.repository }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check Commit Messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Checkout frappe-maintenance
        uses: actions/checkout@v4
        with:
          repository: Aakvatech-Limited/frappe-maintenance
          ref: ${{ inputs.maintenance-ref }}
          path: .frappe-maintenance

      - name: Link config files from frappe-maintenance
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: python3 .frappe-maintenance/scripts/app_config_links.py ci --root . --repository "$REPOSITORY"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Check commit messages
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || inputs.base-sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          npm install @commitlint/cli @commitlint/config-conventional conventional-changelog-conventionalcommits
          if [ -z "$FROM_SHA" ]; then
            echo "::error::No base commit. Run this check from a pull request, or pass base-sha."
            exit 1
          fi
          npx commitlint --verbose --from "$FROM_SHA" --to "$TO_SHA"
