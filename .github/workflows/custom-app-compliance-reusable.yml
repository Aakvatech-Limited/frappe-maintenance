name: Reusable Custom App Compliance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compliance:
    name: Check custom app compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout compliance rules
        uses: actions/checkout@v4
        with:
          repository: Aakvatech-Limited/frappe-maintenance
          ref: main
          path: .frappe-maintenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run compliance audit
        run: |
          python .frappe-maintenance/scripts/check_custom_app_compliance.py \
            --root . \
            --config .frappe-maintenance/configs/custom-app-compliance.json \
            --json-output custom-app-compliance.json

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-compliance-report
          path: custom-app-compliance.json
          if-no-files-found: ignore
