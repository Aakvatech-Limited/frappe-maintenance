name: Semantic Commits


on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      base-sha:
        description: Check only changes after this commit. Required for manual runs.
        type: string
        required: false

permissions:
  contents: read

jobs:
  shared:
    uses: Aakvatech-Limited/frappe-maintenance/.github/workflows/semantic-commits-reusable.yml@stable
    with:
      base-sha: ${{ inputs.base-sha }}
