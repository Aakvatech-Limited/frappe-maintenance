# Managed by Aakvatech-Limited/frappe-maintenance. Every check and workflow is defined there.
name: Aakvatech CI

on:
  pull_request:
  pull_request_target:
    types: [closed, labeled]
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [checks, compliance, modernize]
        default: checks
      base-sha:
        description: Checks only. Check only changes after this commit; required for commit messages.
        type: string
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: Aakvatech-Limited/frappe-maintenance/.github/workflows/router.yml@stable
    with:
      task: ${{ inputs.task }}
      base-sha: ${{ inputs.base-sha }}
