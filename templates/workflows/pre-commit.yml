name: Pre-commit


on:
  pull_request:
  workflow_dispatch:
    inputs:
      base-sha:
        description: Check only changes after this commit. Leave empty to check everything.
        type: string
        required: false

permissions:
  contents: read

jobs:
  shared:
    uses: Aakvatech-Limited/frappe-maintenance/.github/workflows/pre-commit-reusable.yml@main
    with:
      maintenance-ref: main
      base-sha: ${{ inputs.base-sha }}
