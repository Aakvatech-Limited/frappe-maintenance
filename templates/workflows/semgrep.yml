name: Semgrep


on:
  pull_request:
  workflow_dispatch:
    inputs:
      base-sha:
        description: Check only changes after this commit. Leave empty to check everything.
        type: string
        required: false

permissions:
  contents: read

jobs:
  shared:
    uses: Aakvatech-Limited/frappe-maintenance/.github/workflows/semgrep-reusable.yml@stable
    with:
      base-sha: ${{ inputs.base-sha }}
